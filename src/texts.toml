[en]
"mod.name" = "Envibed"
"mod.description" = "Vibrates Intiface devices when your character deals damage, makes a kill, gains experience or dies, and rumbles in the Shroud."
"config" = "Envibed"
"config.enabled" = "On"
"config.enabled.doc" = "Whether the toys react at all."
"config.url" = "Intiface address"
"config.url.doc" = "Intiface Central's server, ws://127.0.0.1:12345 by default."
"config.hit_strength" = "Dealing damage: strength"
"config.hit_strength.doc" = "0 to 1; 0 turns it off. Only in worlds you host."
"config.hit_duration_ms" = "Dealing damage: duration (ms)"
"config.hit_duration_ms.doc" = "How long it vibrates before the 15 s fade."
"config.kill_strength" = "Kill: strength"
"config.kill_strength.doc" = "0 to 1; 0 turns it off. Only in worlds you host."
"config.kill_duration_ms" = "Kill: duration (ms)"
"config.kill_duration_ms.doc" = "How long it vibrates before the 15 s fade."
"config.death_strength" = "Death: strength"
"config.death_strength.doc" = "0 to 1; 0 turns it off."
"config.death_duration_ms" = "Death: duration (ms)"
"config.death_duration_ms.doc" = "How long it vibrates before the 15 s fade."
"config.xp" = "Experience"
"config.xp.doc" = "Gaining experience vibrates: the amount in percent (10% to 100%) for 1 to 5 s, stacking."
"config.shroud_low" = "Shroud: low"
"config.shroud_low.doc" = "Rumble while plenty of time is left, 0 to 1; it rises from here over the last 3 minutes."
"config.shroud_high" = "Shroud: high"
"config.shroud_high.doc" = "Rumble as the timer reaches zero, 0 to 1."
"config.shroud_dangerous" = "Shroud: dangerous"
"config.shroud_dangerous.doc" = "Rumble in the dangerous Shroud, where the timer drains several times faster, 0 to 1."

